status:
  scope: >-
    The compared declaration formalizes the manuscript's quantitative
    auxiliary theorem. It is conditional on the explicit proposition
    UpperBoundSieveDimOne, a source-matched finite weighted form of the
    dimension-one upper-bound sieve; the fundamental lemma itself is not
    proved in Lean. All problem-specific arguments downstream of that theorem
    are formalized. The large-prime-factor intermediate estimate used by the
    final proof has threshold constant 1/40 instead of the manuscript's 1/8;
    this changes only a sufficiently-large-L threshold and not the compared
    conclusion. The original prime form of Erdos Problem 1059 remains open and
    is outside the formalized claim.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: [propext, Classical.choice, Quot.sound]
  main_results:
    - declaration: "FactorialHypergraph.Palomar.quantitative_auxiliary_erdos"
      module: "Solution"
      summary: >-
        A quantitative lower bound for L-rough integers in a factorial
        interval whose differences from every relevant factorial are
        composite, conditional on UpperBoundSieveDimOne.

