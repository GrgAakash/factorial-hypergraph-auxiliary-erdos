fidelity:
  divergences: >-
    The compared Lean theorem exposes UpperBoundSieveDimOne as an explicit
    hypothesis, whereas the manuscript cites the established fundamental
    lemma as an external theorem. That fundamental lemma is not formalized in
    Lean here. The downstream large-prime-factor argument uses the weaker
    threshold (i log i)/40 rather than the manuscript's (i log i)/8; the final
    quantitative statement is unchanged. The Lean transference theorem obtains
    X^(eta/2) where the manuscript obtains X^eta, because Lean uses the
    elementary estimate W <= 4^L in place of Mertens's product estimate. Since
    the compared theorem asserts only the existence of some absolute positive
    exponent, this rescaling leaves its statement unchanged. An unused
    singleton-baseline lemma has 21 in place of the manuscript's 20 after
    bounding an integer ceiling; it is not in the final dependency chain. The
    manuscript sets kappa(L) to positive infinity when no rainbow cover exists,
    while Lean defines real-valued kappa by sInf, which is zero for an empty
    cover family. Every result used here constructs a cover explicitly, so the
    empty-family convention is never used by the compared theorem. The theorem
    concerns rough composite candidates n, not prime n, and makes no claim to
    solve Erdos Problem 1059.

review:
  status: "agent-reviewed and author-supervised"
  reviewers:
    - "Aristotle proof and dependency audit"
    - "OpenAI Codex independent archive and build audit"
    - "Three independent OpenAI Codex presubmission referee audits"
  notes: >-
    A clean independent build accepted all proof modules under Lean 4.28.0 and
    Mathlib revision 8f9d9cff6bd728b17a24e163c9402775d9e6a365. Source scans
    found no sorry, admit, unsafe declaration, opaque placeholder, or custom
    axiom outside the deliberate Challenge statement hole. Exported theorems
    report only propext, Classical.choice, and Quot.sound. The sieve interface
    was compared line by line with Koukoulopoulos, Theorem 18.11(a), as
    documented in docs/SIEVE_SOURCE_AUDIT.md. Three independent presubmission
    agents separately reviewed mathematical fidelity, Lean integrity, and
    Palomar compliance; their reconciled report is in
    docs/PRESUBMISSION_REFEREE_AUDIT.md. No independent human expert Lean review
    is claimed.

alignment:
  namespace: "FactorialHypergraph.Palomar"
  statements:
    - source: "Theorem 1.2 of paper/factorial_residue_hypergraphs.tex"
      lean: "FactorialHypergraph.Palomar.quantitative_auxiliary_erdos"
      module: "Solution"
      status: adapted
      note: >-
        The quantitative conclusion and the definition of the counted set
        agree with the manuscript. The Lean statement additionally carries
        UpperBoundSieveDimOne as an explicit hypothesis. The change from 1/8
        to 1/40 occurs only in an intermediate large-prime-factor lemma. The
        transference proof also replaces eta by eta/2 through an elementary
        primorial estimate, and an unused baseline bound uses 21 instead of
        20. Lean's real-valued sInf convention for kappa on an empty cover
        family also differs from the manuscript's positive-infinity convention,
        but the compared proof constructs covers and never uses the empty case.
        None of these changes alters the existential quantitative conclusion.

