version: "v0.4"

project:
  name: "Factorial-residue hypergraphs and an auxiliary problem of Erdos"
  description: >-
    A Lean 4 formalization of a quantitative solution to the auxiliary problem
    suggested by Erdos alongside Problem 1059. Conditional on an explicitly
    stated standard dimension-one upper-bound sieve theorem, the formalization
    proves that for every sufficiently large L there are at least
    ((L+1)!)^eta/(100 log L) integers n in (2L!, (L+1)!] whose prime factors
    all exceed L and for which n-k! is composite for every 1 <= k <= L. The
    formalization does not prove that n is prime and therefore does not solve
    the original Erdos prime problem.
  authors:
    - "Aakash Gurung"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Aakash Gurung"

